name: Prepare local release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --backend=copyfile
      - run: bun run lint
      - run: bun run verify
      - run: bun run package:native
      - run: bun run test:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rigshelf-${{ runner.os }}-${{ runner.arch }}
          path: |
            .local/releases/rigshelf-*.tar.gz
            .local/releases/rigshelf-*.tar.gz.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
