name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.4 }
      - name: Match the tag to package.json
        env: { TAG: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          [ "v$version" = "$TAG" ] || { echo "Tag $TAG does not match package.json $version"; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Build every target with the web interface embedded
        run: bun scripts/release.ts out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: builds, path: out, if-no-files-found: error, retention-days: 1 }
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: builds, path: dist }
      - name: List the files
        run: cd dist && sha256sum *.tar.gz *.zip > checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-checksums: dist/checksums.txt }
      - name: Hand the draft to the tapster hub
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ github.ref_name }}" }
        run: gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt --draft --verify-tag --generate-notes --title "$TAG" $( [ "${TAG#*-}" != "$TAG" ] && echo --prerelease )
