name: App
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "tests/**"
      - "scripts/**"
      - "!scripts/ui-site.ts"
      - "!scripts/site-*.ts"
      - "plugin/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "biome.json"
      - "vite.config.ts"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "web/**"
      - "tests/**"
      - "scripts/**"
      - "!scripts/ui-site.ts"
      - "!scripts/site-*.ts"
      - "plugin/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "biome.json"
      - "vite.config.ts"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
permissions:
  contents: read
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run verify
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:ui
