name: npm
on:
  release:
    types: [published]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, ref: "${{ github.event.release.tag_name }}" }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.4 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Assemble the npm package
        run: bun scripts/npm-package.ts npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: npm, path: npm, if-no-files-found: error, retention-days: 1 }
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: npm, path: npm }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - name: Publish with npm trusted publishing
        env: { PRE: "${{ github.event.release.prerelease }}" }
        run: |
          set -euo pipefail
          cd npm
          if [ "$PRE" = "true" ]; then npm publish --access public --tag next; else npm publish --access public; fi
