</style></head><body>
<div id="stage"></div>
<nav class="proto-picker" aria-label="Prototype variants"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">All together</button><button class="proto-picker-item">Step by step</button><button class="proto-picker-item">Files visible</button></nav>
<script>
const icons={grid:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',folder:'M3 7V5h7l2 2h9v13H3z',library:'M4 4v16M9 4v16M14 4v16M18 4l3 16',arrow:'M5 12h14M13 6l6 6-6 6',chevron:'M6 9l6 6 6-6',check:'M5 12l4 4L19 6',settings:'M12 8a4 4 0 100 8 4 4 0 000-8M12 3v3M12 18v3M3 12h3M18 12h3',shield:'M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z',layers:'M12 3L2 8l10 5 10-5zM2 13l10 5 10-5M2 18l10 5 10-5'};
const icon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${icons[name]||icons.grid}"/></svg>`;
const presets=[{name:'Expo + React Native',detail:'Mobile · TypeScript',skills:['react-native-best-practices','expo-router','better-auth','react-native-testing'],mcp:['Expo MCP','Sentry MCP']},{name:'Bun + Hono',detail:'Backend · TypeScript',skills:['hono','better-auth','api-design','security-audit'],mcp:['Cloudflare MCP','Sentry MCP']},{name:'iOS · SwiftUI',detail:'Native · Swift',skills:['swiftui','swift-concurrency','apple-design','app-store-review'],mcp:['Xcode MCP','Sentry MCP']}];
let projectPath='~/Projects/fieldnotes';
let chosenPreset=0, chosenAgents=new Set(['Codex','Claude Code']), selected=new Set([0,1,2,3,4,5]), step=0, view='Setup';
const agents=()=>`<div class="agents">${['Codex','Claude Code','OpenCode','Kiro'].map(name=>`<button class="agent" aria-pressed="${chosenAgents.has(name)}" data-agent="${name}">${chosenAgents.has(name)?icon('check'):icon('grid')}${name}</button>`).join('')}</div>`;
const preset=()=>`<div class="preset-wrap"><button class="preset-trigger" data-menu aria-expanded="false"><span>${presets[chosenPreset].name}<small>${presets[chosenPreset].detail}</small></span>${icon('chevron')}</button><div class="preset-menu" role="listbox" aria-label="Starting preset" hidden>${presets.map((item,index)=>`<button role="option" aria-selected="${index===chosenPreset}" data-preset="${index}">${item.name}</button>`).join('')}</div></div>`;
const capabilities=()=>`<div class="capabilities">${[...presets[chosenPreset].skills,...presets[chosenPreset].mcp].map((name,index)=>`<div class="capability"><label><input type="checkbox" data-capability="${index}" ${selected.has(index)?'checked':''}><span><strong>${name}</strong><small>${index<4?'Pinned snapshot · from your library':'Project connection'}</small></span></label><span class="kind">${index<4?'Skill':'MCP'}</span></div>`).join('')}</div>`;
const summary=()=>`<aside class="review-panel"><p class="setup-eyebrow">THIS PROJECT ONLY</p><h3>Your project kit</h3><p>A focused setup for Fieldnotes.<br>Everything else stays in your library.</p><div class="summary-row"><span>Skills</span><strong>${[...selected].filter(i=>i<4).length}</strong></div><div class="summary-row"><span>MCP servers</span><strong>${[...selected].filter(i=>i>=4).length}</strong></div><div class="summary-row"><span>Agents</span><strong>${chosenAgents.size}</strong></div><div class="summary-row"><span>Guidance</span><strong>3 scoped rules</strong></div><button class="primary" data-review ${!chosenAgents.size?'disabled':''}>Review files ${icon('arrow')}</button><div class="hint">${icon('shield')}<span>Preview every change.<br>Roll back when you need to.</span></div></aside>`;
const pathField=()=>`<label class="field"><span>Project directory</span><input class="path" value="~/Projects/fieldnotes" aria-label="Project directory"></label>`;
const nav=()=>`<nav class="side-nav" aria-label="Main navigation">${[['Setup','grid'],['Library','library'],['Projects','folder'],['Settings','settings']].map(([name,glyph])=>`<button data-view="${name}" class="${view===name?'active':''}" aria-label="${name}">${icon(glyph)}<span>${name}</span></button>`).join('')}</nav>`;
const appHeader=(style='')=>`<header class="app-top"><span class="wordmark">${icon('layers')}Project kits</span>${style==='canvas'?'<nav class="canvas-nav">'+['Setup','Library','Projects'].map(name=>`<button data-view="${name}" class="${view===name?'active':''}">${name}</button>`).join('')+'</nav>':'<span class="breadcrumb">Fieldnotes / Project setup</span>'}<span class="local">Local</span></header>`;
const catalog=()=>`<section class="catalog-view"><p class="setup-eyebrow">${view==='Library'?'YOUR REUSABLE CAPABILITIES':view==='Projects'?'YOUR WORKSPACES':'LOCAL PREFERENCES'}</p><h2>${view}</h2>${view==='Settings'?'<p class="intro">These are prototype preferences. No project files are changed.</p><label class="field"><span>Default agents</span></label>'+agents():view==='Projects'?'<p class="intro">Choose a project to prepare its kit.</p><button class="secondary-button" data-view="Setup">'+icon('folder')+' Fieldnotes · Expo + React Native</button>':'<input class="path" placeholder="Find a skill or MCP server…" aria-label="Search library" data-search>'+capabilities()}</section>`;
const workbench=()=>`<article class="prototype-app workbench">${appHeader()}<div class="workbench-body">${nav()}${view==='Setup'?`<main class="workbench-main"><div class="setup-eyebrow">PROJECT SETUP</div><h1 class="title">Set up a project.</h1><p class="intro">Choose the kit. Pick your agents. Review the changes.</p><div class="workbench-columns"><section>${pathField()}<div class="field"><span>Starting preset</span>${preset()}</div><div class="section-label">Agents</div>${agents()}<div class="section-label">Recommended kit<span class="section-count">${selected.size} selected</span></div>${capabilities()}</section>${summary()}</div></main>`:catalog()}</div></article>`;
const canvas=()=>`<article class="prototype-app canvas">${appHeader('canvas')}${view==='Setup'?`<main class="canvas-content"><div class="setup-eyebrow">PROJECT SETUP</div><h1 class="title">Prepare your project.</h1><p class="intro">Choose a folder, select your agents, then review the kit.</p><nav class="steps" aria-label="Setup steps">${['Project','Agents','Your kit'].map((name,index)=>`<button data-step="${index}" class="${step===index?'active':''}"><i>${index+1}</i>${name}</button>`).join('')}</nav><div class="canvas-columns"><section class="step-card">${step===0?`<div class="step-illustration">${icon('folder')}</div><h2>Choose a project.</h2><p>A new idea or an existing project. Start with its folder.</p>${pathField()}<div class="field"><span>Starting preset</span>${preset()}</div>`:step===1?'<h2>Choose your agents.</h2><p>The same kit, adapted to the tools you work with.</p>'+agents()+'<div class="hint">'+icon('shield')+'Your model choice stays in your agent. This selects the project file format.</div>':'<h2>Review your kit.</h2><p>Keep these recommendations or adjust your kit.</p>'+capabilities()}<div class="step-actions"><button class="secondary-button" data-step="${Math.max(0,step-1)}">${step?'Back':'Project details'}</button><button class="primary" ${step===2?'data-review':`data-step="${step+1}"`}>${step===2?'Review files':'Continue'}${icon('arrow')}</button></div></section>${summary()}</div></main>`:catalog()}</article>`;
const fileList=()=>['AGENTS.md',...[...chosenAgents].map(name=>name==='Claude Code'?'.claude/skills/':'.agents/skills/'),'.kitfold/kit.json',...(selected.has(4)?['.mcp.json']:[])];
const consoleView=()=>`<article class="prototype-app console">${appHeader()}<nav class="console-tabs">${['Setup','Library','Projects','Settings'].map(name=>`<button data-view="${name}" class="${view===name?'active':''}">${name==='Setup'?'Fieldnotes / setup':name}</button>`).join('')}</nav>${view==='Setup'?`<div class="console-body"><aside class="console-context"><p class="setup-eyebrow">ACTIVE PROJECT</p><h2>Fieldnotes</h2><p class="intro">Local workspace</p>${pathField()}<div class="field"><span>Preset</span>${preset()}</div></aside><main class="console-center"><h1 class="title">Project kit</h1><p class="intro">Pinned capabilities. Explicit project scope.</p>${agents()}<div class="section-label">Capabilities<span class="section-count">${selected.size} selected</span></div>${capabilities()}</main><aside class="file-rail"><div class="panel-title">File preview</div>${fileList().map(file=>`<div class="file"><span>+</span>${file}</div>`).join('')}<div class="hint">${icon('shield')}No changes applied.</div></aside></div><footer class="console-bottom"><p><strong>${selected.size} capabilities</strong> · ${chosenAgents.size} agents<br>3 scoped rules · project only</p><button class="primary" data-review ${!chosenAgents.size?'disabled':''}>Review changes${icon('arrow')}</button></footer>`:catalog()}</article>`;
const variants=[workbench,canvas,consoleView];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
function moveHighlight() {const el = items[current];highlight.style.width = el.offsetWidth + 'px';highlight.style.transform = `translateX(${el.offsetLeft}px)`;}
function mount(i) {stage.innerHTML = '';requestAnimationFrame(() => { stage.innerHTML = variants[i](); const input=stage.querySelector('[aria-label="Project directory"]'); if(input)input.value=projectPath; });}
function setActive(i) {if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i);}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay?.addEventListener('click',()=>mount(current));window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',(event)=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)||event.target.isContentEditable)return;if(event.metaKey||event.ctrlKey||event.altKey)return;const num=parseInt(event.key,10);if(num>=1&&num<=variants.length)setActive(num-1);else if(event.key==='ArrowRight')setActive((current+1)%variants.length);else if(event.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(event.key==='r'||event.key==='R')mount(current);});
stage.addEventListener('click',(event)=>{const button=event.target.closest('button');if(!button)return;if(button.hasAttribute('data-menu')){const menu=button.nextElementSibling;menu.hidden=!menu.hidden;button.setAttribute('aria-expanded',String(!menu.hidden));if(!menu.hidden)menu.querySelector('button').focus();return;}if(button.hasAttribute('data-preset')){chosenPreset=Number(button.dataset.preset);selected=new Set([0,1,2,3,4,5]);mount(current);}else if(button.hasAttribute('data-agent')){const name=button.dataset.agent;if(chosenAgents.has(name))chosenAgents.delete(name);else chosenAgents.add(name);mount(current);}else if(button.hasAttribute('data-step')){step=Number(button.dataset.step);mount(current);}else if(button.hasAttribute('data-view')){view=button.dataset.view;mount(current);}else if(button.hasAttribute('data-review')){const dialog=document.createElement('dialog');dialog.className='review-dialog';dialog.innerHTML='<h2>Review your project setup</h2><p>This is an interactive design prototype. It does not write to your project.</p><pre>'+fileList().map(file=>'+ '+file).join('\n')+'</pre><button class="primary">Back to editing</button>';stage.querySelector('.prototype-app').append(dialog);dialog.querySelector('button').onclick=()=>dialog.remove();dialog.addEventListener('cancel',()=>dialog.remove());dialog.showModal();}});
stage.addEventListener('change',(event)=>{if(!event.target.hasAttribute('data-capability'))return;const index=Number(event.target.dataset.capability);if(event.target.checked)selected.add(index);else selected.delete(index);mount(current);});
stage.addEventListener('input',(event)=>{if(event.target.getAttribute('aria-label')==='Project directory'){projectPath=event.target.value;return;}if(!event.target.hasAttribute('data-search'))return;const query=event.target.value.toLowerCase();stage.querySelectorAll('.capability').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(query));});
document.addEventListener('click',(event)=>{if(event.target.closest('.preset-wrap'))return;document.querySelectorAll('.preset-menu').forEach(menu=>menu.hidden=true);document.querySelectorAll('[data-menu]').forEach(button=>button.setAttribute('aria-expanded','false'));});
stage.addEventListener('keydown',(event)=>{const menu=event.target.closest('.preset-menu');if(!menu)return;if(event.key==='Escape'){event.preventDefault();event.stopPropagation();menu.hidden=true;menu.previousElementSibling.setAttribute('aria-expanded','false');menu.previousElementSibling.focus();}else if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();event.stopPropagation();const options=[...menu.querySelectorAll('button')];const index=options.indexOf(document.activeElement);options[(index+(event.key==='ArrowDown'?1:-1)+options.length)%options.length].focus();}});
setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script></body></html>
