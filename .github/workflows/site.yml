name: Website
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "THIRD_PARTY_NOTICES.md"
      - "plugin/skills/rigshelf/SKILL.md"
      - "web/public/fonts/**"
      - "scripts/ui-site.ts"
      - "scripts/site-*.ts"
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "THIRD_PARTY_NOTICES.md"
      - "plugin/skills/rigshelf/SKILL.md"
      - "web/public/fonts/**"
      - "scripts/ui-site.ts"
      - "scripts/site-*.ts"
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - ".github/workflows/site.yml"
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --cwd site --frozen-lockfile --backend=copyfile
      - run: bunx biome check site
      - run: bun run site:check
      - run: bun run --cwd site lint
      - run: bun run --cwd site test
      - run: bun run site:build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:site
